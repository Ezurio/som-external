# /etc/asound.conf
# Force software resampling for sample rates not supported by the hardware.
# The 'plug' plugin transparently converts rate, format, and channel count
# so applications requesting unachievable rates are resampled in software.

pcm.!default {
	type plug
    slave {
        pcm "hw:0,0" # Change to your card
        rate 48000   # Force conversion to 48kHz
    }
}

ctl.!default {
	type hw
	card 0
}

# Select the SRC algorithm used by the 'rate' plugin.
# Options (best to fastest): speexrate_best, speexrate_medium,
# speexrate (speexrate_fast), linear, samplerate_best, samplerate
#defaults.pcm.rate_converter "speexrate_medium"
