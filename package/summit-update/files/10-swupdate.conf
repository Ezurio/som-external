. /usr/sbin/boot-rootfs.sh

getSocId
case "${soc_id}" in
	sama5d31)
		keyrev=$(fw_printenv -n keyrev)
		[ -z "${keyrev}" ] || keyrev="-${keyrev}"

		SWUPDATE_ARGS="${SWUPDATE_ARGS} -H wb50${keyrev}:1.0 -q stable,main-a -q stable,main-b"
		;;

	sama5d36)
		[ -r /etc/hw_rev ] && read -r HW_REV < /etc/hw_rev
		[ -n "$HW_REV" ] || HW_REV="1.0"

		ram_size=$(free -m | sed -rn 's/^Mem:\s+([0-9]+).*/\1/p')

		if [ "${ram_size}" -le 128 ]; then
			HW_ARGS="-H som60:${HW_REV}"
		elif [ "${ram_size}" -le 256 ]; then
			HW_ARGS="-H som60x2:${HW_REV}"
		else
			HW_ARGS="-H unknown"
		fi

		[ -r /etc/swu_args ] && \
		read -r CUST_ARGS < /etc/swu_args

		SWUPDATE_ARGS="${SWUPDATE_ARGS} ${HW_ARGS} ${CUST_ARGS} -q stable,main-a -q stable,main-b"
		;;
esac

SWUPDATE_ARGS="${SWUPDATE_ARGS} -q stable,full-a -q stable,full-b -q stable,complete"

# Under systemd, ExecStart's stdout/stderr is already captured into the
# journal; adding -L would duplicate every message via syslog()->/dev/log.
if [ ! -d /run/systemd/system ]; then
	SWUPDATE_ARGS="${SWUPDATE_ARGS} -L"
fi

if [ "${rootDevType}" = "SD" ] && [ -d /opt/swupdate ] && [ -w /opt/swupdate ]; then
	export TMPDIR=/opt/swupdate
fi
